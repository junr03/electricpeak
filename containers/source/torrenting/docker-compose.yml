# All torrenting related services.
services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/wireguard_private_key
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    networks:
      - electricpeak
    ports:
      - 8080:8080/tcp #qbittorrent webui
      - 6000:8000
      - 6083:8083
      - 9696:9696
      - 5010:5010 # mousehole webui
    volumes:
      - ${DOCKERCONFDIR}/gluetun/config.toml:/gluetun/auth/config.toml
      - /run/onepassword-secrets/gluetunEnvironment:/run/secrets/wireguard_private_key:ro
    restart: unless-stopped

  mousehole:
    container_name: mousehole
    image: tmmrtn/mousehole:latest
    network_mode: "service:gluetun"
    environment:
      - TZ=${TZ}
      - MOUSEHOLE_HTTPS_ONLY_COOKIES=true
    volumes:
      # persist cookie data across container restarts
      - "${DOCKERCONFDIR}/mousehole:/var/lib/mousehole"
    restart: unless-stopped

  # qbittorrent - https://hotio.dev/containers/qbittorrent/
  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/qbittorrent:/config
      - ${DOCKERSTORAGEDIR}/torrents:/data
    network_mode: "service:gluetun"

  # Prowlarr - https://hotio.dev/containers/prowlarr/
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/prowlarr:/config
      - ${DOCKERSTORAGEDIR}:/data

networks:
  electricpeak:
    name: electricpeak
    external: true

volumes:
  mousehole:
