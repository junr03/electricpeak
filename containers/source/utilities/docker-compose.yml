# Re-evaluate.
services:
  opendashboards:
    # Production adapters and packaging are maintained in electricpeak-services.
    image: &opendashboards-image ghcr.io/junr03/electricpeak-services/opendashboards@sha256:b1d6495aa92b1e42e00a020e9ba7a89a219fe8efe7915916893470deef555072
    container_name: opendashboards
    user: "1000:100"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /app/.next/cache:uid=1000,gid=100
    environment:
      # The private Nix module overrides this with the external HTTPS origin.
      - APP_ORIGIN=https://dashboards.example.invalid
      - OPENDASHBOARDS_PRIVATE_DESTINATIONS_FILE=/run/secrets/private-destinations.json
    volumes:
      - /var/lib/opendashboards/state:/data:ro
      - /run/onepassword-secrets/thesysApiKey:/run/secrets/thesys-api-key:ro
      - /run/onepassword-secrets/opendashboardsPrivateDestinations:/run/secrets/private-destinations.json:ro
    depends_on:
      opendashboards-init:
        condition: service_completed_successfully
      opendashboards-db:
        condition: service_healthy
    networks:
      - electricpeak
      - opendashboards-db
    restart: unless-stopped

  opendashboards-init:
    image: *opendashboards-image
    container_name: opendashboards-init
    user: "1000:100"
    command: ["init"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/lib/opendashboards/state:/data
    restart: "no"

  opendashboards-db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    container_name: opendashboards-db
    security_opt: ["no-new-privileges:true"]
    environment:
      - POSTGRES_USER=opendashboards
      - POSTGRES_DB=opendashboards
      - POSTGRES_PASSWORD_FILE=/run/secrets/database-password
    volumes:
      - opendashboards-postgres:/var/lib/postgresql/data
      - /var/lib/opendashboards/state/database-password:/run/secrets/database-password:ro
    depends_on:
      opendashboards-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U opendashboards -d opendashboards"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - opendashboards-db
    restart: unless-stopped

  substack-digest:
    # Published and tested independently in electricpeak-services.
    image: ghcr.io/junr03/electricpeak-services/substack-digest@sha256:4c76fcfc0906eebcf93ee7ff064f0ea6352bb507752a90cdfb7ccde7fcfc3786
    container_name: substack-digest
    user: "1000:100"
    restart: "no"
    labels:
      - "compose2nix.settings.autoStart=false"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: "256m"
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      - RMAPI_CONFIG_DIR=/data/rmapi
    volumes:
      - /var/lib/substack-digest:/data
      - ${DOCKERCONFDIR}/substack-digest:/config:ro
      - /run/onepassword-secrets/substackDigestCookies:/run/secrets/substack-cookies.json:ro
      - /run/onepassword-secrets/substackDigestRemarkableToken:/run/secrets/remarkable-token:ro
    networks:
      - electricpeak

  rawbackup:
    image: ghcr.io/junr03/electricpeak-services/rawbackup@sha256:031088a70ac550171638b08020bfa4feeafd13927174ba35fab41710ba78469a
    container_name: rawbackup
    volumes:
      - /var/lib/rawbackup:/data:ro
      - /var/lib/rawbackup/reconcile:/reconcile
    networks:
      - electricpeak
    restart: unless-stopped

  status:
    # Static status page, published and tested in electricpeak-services. The
    # host-side electricpeak-status-collector timer writes status.json; this
    # container has no Docker socket, host network, or capabilities.
    image: ghcr.io/junr03/electricpeak-services/status@sha256:c9a4c2b16a745eae2f66f55f25985254c1d27fbefd6b40d159fb382654600100
    container_name: status
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /var/cache/nginx
    volumes:
      - /var/lib/electricpeak-status:/srv/status-data:ro
    networks:
      - electricpeak
    restart: unless-stopped

  contact-sync:
    # vdirsyncer 0.20.0 in the signed Vdirsyncer-DOCKERIZED 2.6.1 image.
    image: bleala/vdirsyncer:2.6.1@sha256:cbe4a492453b597fdeef996a7e1555c8da9208307efb2ec1e4a059cda6123b3d
    container_name: contact-sync
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - AUTODISCOVER=false
      - AUTOSYNC=true
      - AUTOUPDATE=false
      - CRON_TIME=*/15 * * * *
      - PRE_SYNC_SCRIPT_FILE=/vdirsyncer/require-enabled.sh
    networks:
      - electricpeak
    volumes:
      - ${DOCKERCONFDIR}/vdirsyncer:/vdirsyncer
      - /run/onepassword-secrets/vdirsyncerGoogleClientId:/vdirsyncer/secrets/google-client-id:ro
      - /run/onepassword-secrets/vdirsyncerGoogleClientSecret:/vdirsyncer/secrets/google-client-secret:ro
      - /run/onepassword-secrets/vdirsyncerIcloudUsername:/vdirsyncer/secrets/icloud-username:ro
      - /run/onepassword-secrets/vdirsyncerIcloudAppPassword:/vdirsyncer/secrets/icloud-app-password:ro

  foodlog-sync:
    image: ghcr.io/junr03/foodlog-sync:latest
    container_name: foodlog-sync
    user: "${PUID}:${PGID}"
    command: ["--write", "--poll-interval", "900"]
    environment:
      - GOOGLE_DRIVE_FOLDER_ID_FILE=/run/secrets/google-drive-folder-id
      - GOOGLE_DRIVE_TOKEN_FILE=/run/secrets/google-drive-token.json
      - CRONOMETER_USERNAME_FILE=/run/secrets/cronometer-username
      - CRONOMETER_PASSWORD_FILE=/run/secrets/cronometer-password
      - CRONOMETER_SESSION_PATH=/data/cronometer-session.json
      - CRONOMETER_ACCOUNT_TZ=${TZ}
      - FOODLOG_DATABASE_PATH=/data/ledger.sqlite3
      - FOODLOG_RAW_DIR=/data/raw
      - FOODLOG_ENABLE_WRITES=true
    volumes:
      - ${DOCKERCONFDIR}/foodlog-sync:/data
      - /run/onepassword-secrets/foodlogGoogleDriveFolderId:/run/secrets/google-drive-folder-id:ro
      - /run/onepassword-secrets/foodlogGoogleDriveToken:/run/secrets/google-drive-token.json:ro
      - /run/onepassword-secrets/foodlogCronometerUsername:/run/secrets/cronometer-username:ro
      - /run/onepassword-secrets/foodlogCronometerPassword:/run/secrets/cronometer-password:ro
    networks:
      - electricpeak
    restart: unless-stopped

networks:
  opendashboards-db:
    name: opendashboards-db
    internal: true
  electricpeak:
    name: electricpeak
    external: true

volumes:
  opendashboards-postgres:
    name: opendashboards-postgres
