name: Public configuration checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install homeassistant==2024.10.0 josepy==1.14.0 colorlog==6.8.2 pyyaml
      - name: Validate example configuration
        run: |
          cp -R containers/config/home_assistant "$RUNNER_TEMP/home-assistant-config"
          printf 'test_secret: dummy_value\n' > "$RUNNER_TEMP/home-assistant-config/secrets.yaml"
          python -m homeassistant --script check_config --config "$RUNNER_TEMP/home-assistant-config"

  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Evaluate public configuration
        run: |
          test ! -e private-config/configuration.nix
          nix flake check --no-build
          nix eval .#nixosConfigurations.electricpeak-public.config.networking.hostName
      - name: Check generated Compose modules
        run: |
          ./containers/generate-docker-modules.sh
          git diff --exit-code -- containers/source/
      - name: Check Rust and API contract
        run: |
          nix develop .#rust --command cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          nix develop .#rust --command cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- --deny warnings
          nix develop .#rust --command cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
          nix build .#checks.x86_64-linux.rawbackup-status-collector .#checks.x86_64-linux.rawbackup-api-contract
      - name: Test photo workflow
        run: python3 -m unittest discover -s modules/photo-workflow/tests
