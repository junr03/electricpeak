name: Test Substack digest (no account access)
on:
  pull_request:
    paths:
      - rust/**
      - containers/source/utilities/substack-digest/**
      - containers/config/substack-digest/**
      - .github/workflows/substack-digest.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Build pinned container
        run: docker build -t substack-digest:test -f containers/source/utilities/substack-digest/Dockerfile .
      - name: Render fixture with production restrictions
        run: |
          mkdir -p "$RUNNER_TEMP/digest-output"
          chmod 777 "$RUNNER_TEMP/digest-output"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --shm-size 256m \
            --tmpfs /tmp:size=512m,mode=1777 \
            -v "$PWD/containers/config/substack-digest:/config:ro" \
            -v "$RUNNER_TEMP/digest-output:/output" \
            substack-digest:test --smoke-test /output/sample.pdf
      - name: Check PDF dimensions and text
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          bash containers/source/utilities/substack-digest/check-sample.sh "$RUNNER_TEMP/digest-output/sample.pdf"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: move-sample-pdf
          path: ${{ runner.temp }}/digest-output/sample.pdf
